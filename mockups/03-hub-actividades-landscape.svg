<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/><stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="avYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.10"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .num { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #9f1d35; }
      .name { font-family: 'Fredoka', sans-serif; font-weight: 700; fill: #1e3a5f; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="#f5f3ee"/>

  <!-- ===== HEADER ===== -->
  <g id="header">
    <rect x="0" y="0" width="1024" height="84" fill="#fff"/>
    <line x1="0" y1="84" x2="1024" y2="84" stroke="#e5e7eb"/>
    <!-- Brand mini -->
    <rect x="32" y="26" width="32" height="32" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="26" width="16" height="32" rx="8" fill="#c8102e"/>
    <rect x="40" y="26" width="8" height="32" fill="#c8102e"/>
    <text x="40" y="48" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">R</text>
    <text x="56" y="48" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">F</text>
    <!-- Avatar + greeting -->
    <circle cx="488" cy="42" r="22" fill="url(#avYellow)"/>
    <text x="488" y="50" text-anchor="middle" font-size="22">🦊</text>
    <text x="520" y="48" class="h2" font-size="20">¡Hola, Liam!</text>
    <!-- Exit -->
    <rect x="912" y="22" width="80" height="40" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="930" y="48" font-size="14">🚪</text>
    <text x="954" y="48" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Salir</text>
  </g>

  <!-- ===== TITLE ===== -->
  <g id="title">
    <text x="48" y="138" class="h1" font-size="32">¿A qué jugamos hoy?</text>
    <text x="48" y="166" class="body" font-size="15">Elige una actividad y empezamos.</text>
  </g>

  <!-- ===== ACTIVITIES GRID 4x2 ===== -->
  <g id="grid" transform="translate(48, 200)">
    <!-- Row 1 -->
    <!-- 01 Vocales (completed) -->
    <g filter="url(#softShadow)">
      <rect width="216" height="200" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="186" cy="24" r="14" fill="#22c55e"/>
      <text x="186" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="108" y="80" text-anchor="middle" font-size="48">🎨</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11">01</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18">Vocales</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#22c55e"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>
    <!-- 02 Escribir (completed) -->
    <g transform="translate(232, 0)" filter="url(#softShadow)">
      <rect width="216" height="200" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="186" cy="24" r="14" fill="#22c55e"/>
      <text x="186" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="108" y="80" text-anchor="middle" font-size="48">✏️</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11">02</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18">Escribir</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#22c55e"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>
    <!-- 03 Huecos (completed) -->
    <g transform="translate(464, 0)" filter="url(#softShadow)">
      <rect width="216" height="200" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="186" cy="24" r="14" fill="#22c55e"/>
      <text x="186" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="108" y="80" text-anchor="middle" font-size="48">🔤</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11">03</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18">Huecos</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#22c55e"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>
    <!-- 04 Ordenar (in progress) -->
    <g transform="translate(696, 0)" filter="url(#softShadow)">
      <rect width="216" height="200" rx="22" fill="#fff" stroke="#c8102e" stroke-width="2"/>
      <circle cx="186" cy="24" r="14" fill="#fbbf24"/>
      <text x="186" y="29" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">▶</text>
      <text x="108" y="80" text-anchor="middle" font-size="48">🔀</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11">04</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18">Ordenar</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="32" y="158" width="92" height="8" rx="4" fill="#c8102e"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">3 de 5 · Continuar</text>
    </g>

    <!-- Row 2 -->
    <!-- 05 Sílabas (in progress) -->
    <g transform="translate(0, 220)" filter="url(#softShadow)">
      <rect width="216" height="200" rx="22" fill="#fff" stroke="#c8102e" stroke-width="2"/>
      <circle cx="186" cy="24" r="14" fill="#fbbf24"/>
      <text x="186" y="29" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">▶</text>
      <text x="108" y="80" text-anchor="middle" font-size="48">🔢</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11">05</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18">Sílabas</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="32" y="158" width="50" height="8" rx="4" fill="#c8102e"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">1 de 5 · Continuar</text>
    </g>
    <!-- 06 Sonido R (locked) -->
    <g transform="translate(232, 220)">
      <rect width="216" height="200" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="186" cy="24" r="14" fill="#9ca3af"/>
      <text x="186" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="108" y="80" text-anchor="middle" font-size="48" opacity="0.4">👂</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">06</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Sonido R</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>
    <!-- 07 Unir (locked) -->
    <g transform="translate(464, 220)">
      <rect width="216" height="200" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="186" cy="24" r="14" fill="#9ca3af"/>
      <text x="186" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="108" y="80" text-anchor="middle" font-size="48" opacity="0.4">🧩</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">07</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Unir</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>
    <!-- 08 Colorear (locked) -->
    <g transform="translate(696, 220)">
      <rect width="216" height="200" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="186" cy="24" r="14" fill="#9ca3af"/>
      <text x="186" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="108" y="80" text-anchor="middle" font-size="48" opacity="0.4">🌈</text>
      <text x="108" y="112" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">08</text>
      <text x="108" y="138" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Colorear</text>
      <rect x="32" y="158" width="152" height="8" rx="4" fill="#e5e7eb"/>
      <text x="108" y="184" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>
  </g>

  <!-- Footer progress -->
  <g id="footer-progress" transform="translate(48, 696)">
    <rect width="928" height="48" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="20" y="30" font-size="20">🌟</text>
    <text x="50" y="32" font-family="Fredoka" font-weight="700" font-size="14" fill="#1e3a5f">3 de 8 actividades · ¡Vas genial, Liam!</text>
    <rect x="600" y="18" width="300" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="600" y="18" width="113" height="12" rx="6" fill="#22c55e"/>
  </g>
</svg>
