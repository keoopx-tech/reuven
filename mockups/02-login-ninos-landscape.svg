<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="avYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="avPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/><stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="avBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset dy="8" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.14"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .name { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="#f5f3ee"/>

  <!-- Decorative blobs -->
  <circle cx="100" cy="120" r="90" fill="#fce7f3" opacity="0.6"/>
  <circle cx="940" cy="640" r="120" fill="#dbeafe" opacity="0.5"/>
  <circle cx="900" cy="100" r="60" fill="#fef3c7" opacity="0.7"/>

  <!-- Nav -->
  <g id="nav">
    <rect x="32" y="14" width="34" height="34" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="14" width="17" height="34" rx="8" fill="#c8102e"/>
    <rect x="40" y="14" width="9" height="34" fill="#c8102e"/>
    <text x="40" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">R</text>
    <text x="58" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">F</text>
    <text x="76" y="32" font-family="Nunito" font-weight="800" font-size="16" fill="#1e3a5f">Reuven</text>
    <text x="76" y="46" font-family="Fredoka" font-weight="600" font-size="9" fill="#9f1d35" letter-spacing="0.5">ENSEÑAMOS A PENSAR</text>
    <text x="976" y="38" text-anchor="end" font-family="Fredoka" font-weight="600" font-size="14" fill="#9f1d35">Ayuda</text>
  </g>

  <!-- Heading -->
  <g id="heading">
    <text x="512" y="156" text-anchor="middle" class="h1" font-size="44">¿Quién va a jugar hoy?</text>
    <text x="512" y="194" text-anchor="middle" class="body" font-size="18">Elige tu perfil para empezar.</text>
  </g>

  <!-- Profiles row (4 cards) -->
  <g id="profiles" transform="translate(82, 250)">
    <!-- Liam -->
    <g filter="url(#softShadow)">
      <rect width="200" height="240" rx="28" fill="#fff"/>
      <circle cx="100" cy="100" r="64" fill="url(#avYellow)"/>
      <text x="100" y="120" text-anchor="middle" font-size="68">🦊</text>
      <rect x="68" y="170" width="64" height="22" rx="11" fill="#fef3c7"/>
      <text x="100" y="185" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="11" fill="#92400e">Niño</text>
      <text x="100" y="216" text-anchor="middle" class="name" font-size="22">Liam</text>
    </g>
    <!-- Ellie -->
    <g transform="translate(220, 0)" filter="url(#softShadow)">
      <rect width="200" height="240" rx="28" fill="#fff"/>
      <circle cx="100" cy="100" r="64" fill="url(#avPink)"/>
      <text x="100" y="120" text-anchor="middle" font-size="68">🐱</text>
      <rect x="68" y="170" width="64" height="22" rx="11" fill="#fce7f3"/>
      <text x="100" y="185" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="11" fill="#9d174d">Niña</text>
      <text x="100" y="216" text-anchor="middle" class="name" font-size="22">Ellie</text>
    </g>
    <!-- Mateo -->
    <g transform="translate(440, 0)" filter="url(#softShadow)">
      <rect width="200" height="240" rx="28" fill="#fff"/>
      <circle cx="100" cy="100" r="64" fill="url(#avBlue)"/>
      <text x="100" y="120" text-anchor="middle" font-size="68">🐻</text>
      <rect x="68" y="170" width="64" height="22" rx="11" fill="#dbeafe"/>
      <text x="100" y="185" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="11" fill="#1e40af">Niño</text>
      <text x="100" y="216" text-anchor="middle" class="name" font-size="22">Mateo</text>
    </g>
    <!-- Add new -->
    <g transform="translate(660, 0)">
      <rect width="200" height="240" rx="28" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="100" cy="100" r="60" fill="#f5f3ee" stroke="#e5e7eb" stroke-width="2"/>
      <text x="100" y="120" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="56" fill="#9ca3af">+</text>
      <text x="100" y="216" text-anchor="middle" class="name" font-size="18" fill="#6b7280">Añadir perfil</text>
    </g>
  </g>

  <!-- Notice -->
  <g id="notice">
    <rect x="232" y="540" width="560" height="46" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="262" y="568" font-size="18">🛡️</text>
    <text x="296" y="568" font-family="Fredoka" font-weight="500" font-size="13" fill="#92400e">Solo personas que conviven con el menor pueden usar su perfil.</text>
  </g>

  <!-- Footer links -->
  <g id="footlinks">
    <text x="512" y="660" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="13" fill="#6b7280">¿Eres adulto?</text>
    <text x="408" y="690" font-family="Fredoka" font-weight="700" font-size="14" fill="#9f1d35">Acceso familias</text>
    <text x="538" y="690" font-family="Fredoka" font-weight="700" font-size="14" fill="#9f1d35">·</text>
    <text x="558" y="690" font-family="Fredoka" font-weight="700" font-size="14" fill="#9f1d35">Acceso profesionales</text>
  </g>
</svg>
