<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/><stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="gPromptBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.14"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .vowel { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #fff; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="#f5f3ee"/>

  <!-- ===== HEADER ===== -->
  <g id="header">
    <rect x="0" y="0" width="1024" height="68" fill="#fff"/>
    <line y1="68" x2="1024" y2="68" stroke="#e5e7eb"/>
    <!-- Back -->
    <rect x="24" y="16" width="80" height="36" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="40" y="40" font-family="Nunito" font-weight="900" font-size="18" fill="#1e3a5f">←</text>
    <text x="60" y="39" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Volver</text>
    <!-- Title center -->
    <text x="512" y="32" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#1e3a5f">🎨  Vocales</text>
    <text x="512" y="52" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="12" fill="#6b7280">Pregunta 3 de 5</text>
    <!-- Pause -->
    <rect x="930" y="16" width="70" height="36" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="965" y="40" text-anchor="middle" font-size="14">⏸</text>
    <text x="980" y="39" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Pausa</text>
  </g>

  <!-- ===== PROMPT (left) ===== -->
  <g id="prompt" transform="translate(60, 110)">
    <rect width="440" height="540" rx="32" fill="url(#gPromptBg)"/>
    <g filter="url(#softShadow)">
      <rect x="60" y="60" width="320" height="320" rx="28" fill="#fff" stroke="#e5e7eb"/>
      <image href="../assets/elefante.png" x="80" y="80" width="280" height="280"/>
    </g>
    <text x="220" y="430" text-anchor="middle" class="h1" font-size="28">¿Con qué vocal</text>
    <text x="220" y="464" text-anchor="middle" class="h1" font-size="28">empieza?</text>
    <!-- Speaker button -->
    <g transform="translate(170, 488)" filter="url(#softShadow)">
      <rect width="100" height="40" rx="20" fill="#c8102e"/>
      <text x="50" y="26" text-anchor="middle" font-size="18">🔊</text>
      <text x="68" y="26" font-family="Fredoka" font-weight="700" font-size="13" fill="#fff">Oír</text>
    </g>
  </g>

  <!-- ===== VOWELS (right) ===== -->
  <g id="vowels" transform="translate(560, 130)">
    <text x="200" y="0" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="18" fill="#1e3a5f">Toca la vocal correcta</text>

    <!-- A pink -->
    <g transform="translate(0, 30)" filter="url(#softShadow)">
      <rect width="180" height="92" rx="24" fill="#ec4899"/>
      <text x="90" y="68" text-anchor="middle" class="vowel" font-size="56">A</text>
    </g>
    <!-- E yellow -->
    <g transform="translate(220, 30)" filter="url(#softShadow)">
      <rect width="180" height="92" rx="24" fill="#fbbf24"/>
      <text x="90" y="68" text-anchor="middle" class="vowel" font-size="56">E</text>
    </g>
    <!-- I blue -->
    <g transform="translate(0, 142)" filter="url(#softShadow)">
      <rect width="180" height="92" rx="24" fill="#3b82f6"/>
      <text x="90" y="68" text-anchor="middle" class="vowel" font-size="56">I</text>
    </g>
    <!-- O green -->
    <g transform="translate(220, 142)" filter="url(#softShadow)">
      <rect width="180" height="92" rx="24" fill="#22c55e"/>
      <text x="90" y="68" text-anchor="middle" class="vowel" font-size="56">O</text>
    </g>
    <!-- U orange (centered last) -->
    <g transform="translate(110, 254)" filter="url(#softShadow)">
      <rect width="180" height="92" rx="24" fill="#f97316"/>
      <text x="90" y="68" text-anchor="middle" class="vowel" font-size="56">U</text>
    </g>

    <!-- Hint -->
    <text x="200" y="396" text-anchor="middle" class="body" font-size="13">💡 Pista: empieza como "Egipto"</text>
  </g>

  <!-- ===== PROGRESS DOTS ===== -->
  <g id="progress" transform="translate(0, 700)">
    <text x="380" y="22" text-anchor="end" font-family="Fredoka" font-weight="600" font-size="13" fill="#6b7280">Progreso</text>
    <!-- 5 dots -->
    <circle cx="430" cy="18" r="14" fill="#22c55e"/>
    <text x="430" y="23" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">✓</text>
    <circle cx="478" cy="18" r="14" fill="#22c55e"/>
    <text x="478" y="23" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">✓</text>
    <circle cx="526" cy="18" r="16" fill="#c8102e" stroke="#9f1d35" stroke-width="2"/>
    <text x="526" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">3</text>
    <circle cx="574" cy="18" r="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="574" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#9ca3af">4</text>
    <circle cx="622" cy="18" r="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="622" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#9ca3af">5</text>
  </g>
</svg>
