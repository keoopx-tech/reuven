<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.16"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <rect width="768" height="1024" fill="url(#gBg)"/>

  <g id="confetti" opacity="0.9">
    <circle cx="60" cy="120" r="6" fill="#ec4899"/>
    <rect x="140" y="80" width="10" height="10" rx="2" fill="#fbbf24" transform="rotate(15 145 85)"/>
    <circle cx="220" cy="100" r="5" fill="#3b82f6"/>
    <rect x="300" y="50" width="8" height="14" rx="2" fill="#22c55e" transform="rotate(-20 304 57)"/>
    <circle cx="400" cy="120" r="7" fill="#c8102e"/>
    <circle cx="540" cy="60" r="5" fill="#f97316"/>
    <rect x="640" y="90" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(40 645 95)"/>
    <circle cx="710" cy="140" r="6" fill="#fbbf24"/>

    <circle cx="60" cy="380" r="6" fill="#fbbf24"/>
    <rect x="700" y="420" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(20 705 425)"/>
    <circle cx="80" cy="700" r="5" fill="#3b82f6"/>
    <rect x="680" y="740" width="8" height="14" rx="2" fill="#22c55e" transform="rotate(-15 684 747)"/>
    <circle cx="60" cy="940" r="7" fill="#ec4899"/>
    <circle cx="700" cy="950" r="6" fill="#fbbf24"/>
    <rect x="30" y="540" width="9" height="9" rx="2" fill="#c8102e" transform="rotate(35 34 545)"/>
    <circle cx="730" cy="580" r="5" fill="#f97316"/>
  </g>

  <g id="center">
    <text x="384" y="240" text-anchor="middle" font-size="140">🎉</text>

    <text x="384" y="320" text-anchor="middle" class="h1" font-size="48">¡Genial, Liam!</text>
    <text x="384" y="358" text-anchor="middle" class="body" font-size="17">Has completado Vocales</text>
    <text x="384" y="380" text-anchor="middle" class="body" font-size="17">con 5 de 5 aciertos</text>

    <g id="stars" transform="translate(232, 410)" filter="url(#softShadow)">
      <text x="0" y="60" font-size="76">⭐</text>
      <text x="100" y="78" font-size="92">⭐</text>
      <text x="222" y="60" font-size="76">⭐</text>
    </g>

    <g id="stats" transform="translate(80, 560)" filter="url(#softShadow)">
      <rect width="608" height="200" rx="22" fill="#fff" stroke="#e5e7eb"/>
      <text x="304" y="38" text-anchor="middle" class="h2" font-size="16">Resumen de la actividad</text>
      <line x1="40" y1="58" x2="568" y2="58" stroke="#e5e7eb"/>

      <text x="120" y="98" text-anchor="middle" font-size="28">⏱</text>
      <text x="120" y="138" text-anchor="middle" class="h2" font-size="22">2:30</text>
      <text x="120" y="160" text-anchor="middle" class="body" font-size="12">Tiempo</text>

      <line x1="218" y1="78" x2="218" y2="180" stroke="#e5e7eb"/>

      <text x="304" y="98" text-anchor="middle" font-size="28">✅</text>
      <text x="304" y="138" text-anchor="middle" class="h2" font-size="22">5/5</text>
      <text x="304" y="160" text-anchor="middle" class="body" font-size="12">Aciertos</text>

      <line x1="390" y1="78" x2="390" y2="180" stroke="#e5e7eb"/>

      <text x="488" y="98" text-anchor="middle" font-size="28">🏆</text>
      <text x="488" y="138" text-anchor="middle" class="h2" font-size="13">¡Nuevo logro!</text>
      <text x="488" y="158" text-anchor="middle" class="body" font-size="11">Maestro de vocales</text>
    </g>

    <g id="ctas" transform="translate(0, 808)">
      <g filter="url(#softShadow)">
        <rect x="80" y="0" width="608" height="60" rx="16" fill="#c8102e"/>
        <text x="384" y="38" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="17" fill="#fff">Siguiente actividad →</text>
      </g>
      <rect x="80" y="76" width="608" height="60" rx="16" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <text x="384" y="114" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="#1e3a5f">Volver al hub</text>
    </g>
  </g>
</svg>
