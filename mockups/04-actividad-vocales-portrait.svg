<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gPromptBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.14"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .vowel { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #fff; }
    </style>
  </defs>

  <rect width="768" height="1024" fill="#f5f3ee"/>

  <!-- Header -->
  <g id="header">
    <rect width="768" height="68" fill="#fff"/>
    <line y1="68" x2="768" y2="68" stroke="#e5e7eb"/>
    <rect x="24" y="16" width="80" height="36" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="40" y="40" font-family="Nunito" font-weight="900" font-size="18" fill="#1e3a5f">←</text>
    <text x="60" y="39" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Volver</text>
    <text x="384" y="32" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#1e3a5f">🎨  Vocales</text>
    <text x="384" y="52" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="12" fill="#6b7280">Pregunta 3 de 5</text>
    <rect x="664" y="16" width="78" height="36" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="700" y="40" text-anchor="middle" font-size="14">⏸</text>
    <text x="715" y="39" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Pausa</text>
  </g>

  <!-- Prompt -->
  <g id="prompt" transform="translate(40, 100)">
    <rect width="688" height="440" rx="32" fill="url(#gPromptBg)"/>
    <g filter="url(#softShadow)">
      <rect x="234" y="40" width="220" height="220" rx="28" fill="#fff" stroke="#e5e7eb"/>
      <image href="../assets/elefante.png" x="248" y="54" width="192" height="192"/>
    </g>
    <text x="344" y="310" text-anchor="middle" class="h1" font-size="32">¿Con qué vocal empieza?</text>
    <g transform="translate(290, 340)" filter="url(#softShadow)">
      <rect width="108" height="42" rx="21" fill="#c8102e"/>
      <text x="54" y="28" text-anchor="middle" font-size="18">🔊</text>
      <text x="74" y="28" font-family="Fredoka" font-weight="700" font-size="14" fill="#fff">Oír</text>
    </g>
  </g>

  <!-- Vowels (3 + 2) -->
  <g id="vowels" transform="translate(40, 580)">
    <text x="344" y="0" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="18" fill="#1e3a5f">Toca la vocal correcta</text>

    <!-- Row 1: A E I -->
    <g transform="translate(0, 28)" filter="url(#softShadow)">
      <rect width="208" height="120" rx="26" fill="#ec4899"/>
      <text x="104" y="86" text-anchor="middle" class="vowel" font-size="68">A</text>
    </g>
    <g transform="translate(240, 28)" filter="url(#softShadow)">
      <rect width="208" height="120" rx="26" fill="#fbbf24"/>
      <text x="104" y="86" text-anchor="middle" class="vowel" font-size="68">E</text>
    </g>
    <g transform="translate(480, 28)" filter="url(#softShadow)">
      <rect width="208" height="120" rx="26" fill="#3b82f6"/>
      <text x="104" y="86" text-anchor="middle" class="vowel" font-size="68">I</text>
    </g>

    <!-- Row 2: O U (centered) -->
    <g transform="translate(120, 168)" filter="url(#softShadow)">
      <rect width="208" height="120" rx="26" fill="#22c55e"/>
      <text x="104" y="86" text-anchor="middle" class="vowel" font-size="68">O</text>
    </g>
    <g transform="translate(360, 168)" filter="url(#softShadow)">
      <rect width="208" height="120" rx="26" fill="#f97316"/>
      <text x="104" y="86" text-anchor="middle" class="vowel" font-size="68">U</text>
    </g>
  </g>

  <!-- Progress dots -->
  <g id="progress" transform="translate(0, 970)">
    <text x="252" y="22" text-anchor="end" font-family="Fredoka" font-weight="600" font-size="13" fill="#6b7280">Progreso</text>
    <circle cx="304" cy="18" r="14" fill="#22c55e"/>
    <text x="304" y="23" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">✓</text>
    <circle cx="352" cy="18" r="14" fill="#22c55e"/>
    <text x="352" y="23" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">✓</text>
    <circle cx="400" cy="18" r="16" fill="#c8102e" stroke="#9f1d35" stroke-width="2"/>
    <text x="400" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">3</text>
    <circle cx="448" cy="18" r="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="448" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#9ca3af">4</text>
    <circle cx="496" cy="18" r="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="496" y="23" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#9ca3af">5</text>
  </g>
</svg>
