<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/><stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="avYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.10"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .num { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #9f1d35; }
      .name { font-family: 'Fredoka', sans-serif; font-weight: 700; fill: #1e3a5f; }
    </style>
  </defs>

  <rect width="768" height="1024" fill="#f5f3ee"/>

  <g id="header">
    <rect width="768" height="84" fill="#fff"/>
    <line y1="84" x2="768" y2="84" stroke="#e5e7eb"/>
    <rect x="32" y="26" width="32" height="32" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="26" width="16" height="32" rx="8" fill="#c8102e"/>
    <rect x="40" y="26" width="8" height="32" fill="#c8102e"/>
    <text x="40" y="48" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">R</text>
    <text x="56" y="48" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">F</text>
    <circle cx="340" cy="42" r="22" fill="url(#avYellow)"/>
    <text x="340" y="50" text-anchor="middle" font-size="22">🦊</text>
    <text x="372" y="48" class="h2" font-size="20">¡Hola, Liam!</text>
    <rect x="656" y="22" width="80" height="40" rx="12" fill="#f5f3ee" stroke="#e5e7eb"/>
    <text x="674" y="48" font-size="14">🚪</text>
    <text x="698" y="48" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Salir</text>
  </g>

  <g id="title">
    <text x="40" y="138" class="h1" font-size="32">¿A qué jugamos hoy?</text>
    <text x="40" y="166" class="body" font-size="15">Elige una actividad y empezamos.</text>
  </g>

  <!-- Grid 2x4 -->
  <g id="grid" transform="translate(40, 200)">
    <!-- 01 -->
    <g filter="url(#softShadow)">
      <rect width="334" height="180" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="304" cy="24" r="14" fill="#22c55e"/>
      <text x="304" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="167" y="78" text-anchor="middle" font-size="48">🎨</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11">01</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18">Vocales</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#22c55e"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>
    <g transform="translate(354, 0)" filter="url(#softShadow)">
      <rect width="334" height="180" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="304" cy="24" r="14" fill="#22c55e"/>
      <text x="304" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="167" y="78" text-anchor="middle" font-size="48">✏️</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11">02</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18">Escribir</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#22c55e"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>

    <g transform="translate(0, 200)" filter="url(#softShadow)">
      <rect width="334" height="180" rx="22" fill="#fff" stroke="#86efac" stroke-width="2"/>
      <circle cx="304" cy="24" r="14" fill="#22c55e"/>
      <text x="304" y="29" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">✓</text>
      <text x="167" y="78" text-anchor="middle" font-size="48">🔤</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11">03</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18">Huecos</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#22c55e"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Completada</text>
    </g>
    <g transform="translate(354, 200)" filter="url(#softShadow)">
      <rect width="334" height="180" rx="22" fill="#fff" stroke="#c8102e" stroke-width="2"/>
      <circle cx="304" cy="24" r="14" fill="#fbbf24"/>
      <text x="304" y="29" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">▶</text>
      <text x="167" y="78" text-anchor="middle" font-size="48">🔀</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11">04</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18">Ordenar</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="60" y="146" width="128" height="8" rx="4" fill="#c8102e"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">3 de 5 · Continuar</text>
    </g>

    <g transform="translate(0, 400)" filter="url(#softShadow)">
      <rect width="334" height="180" rx="22" fill="#fff" stroke="#c8102e" stroke-width="2"/>
      <circle cx="304" cy="24" r="14" fill="#fbbf24"/>
      <text x="304" y="29" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">▶</text>
      <text x="167" y="78" text-anchor="middle" font-size="48">🔢</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11">05</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18">Sílabas</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="60" y="146" width="64" height="8" rx="4" fill="#c8102e"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">1 de 5 · Continuar</text>
    </g>
    <g transform="translate(354, 400)">
      <rect width="334" height="180" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="304" cy="24" r="14" fill="#9ca3af"/>
      <text x="304" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="167" y="78" text-anchor="middle" font-size="48" opacity="0.4">👂</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">06</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Sonido R</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>

    <g transform="translate(0, 600)">
      <rect width="334" height="180" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="304" cy="24" r="14" fill="#9ca3af"/>
      <text x="304" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="167" y="78" text-anchor="middle" font-size="48" opacity="0.4">🧩</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">07</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Unir</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>
    <g transform="translate(354, 600)">
      <rect width="334" height="180" rx="22" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="304" cy="24" r="14" fill="#9ca3af"/>
      <text x="304" y="29" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">🔒</text>
      <text x="167" y="78" text-anchor="middle" font-size="48" opacity="0.4">🌈</text>
      <text x="167" y="106" text-anchor="middle" class="num" font-size="11" fill="#9ca3af">08</text>
      <text x="167" y="130" text-anchor="middle" class="name" font-size="18" fill="#9ca3af">Colorear</text>
      <rect x="60" y="146" width="214" height="8" rx="4" fill="#e5e7eb"/>
      <text x="167" y="170" text-anchor="middle" class="body" font-size="11">Bloqueada</text>
    </g>
  </g>

  <g id="footer-progress" transform="translate(40, 952)">
    <rect width="688" height="48" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="20" y="30" font-size="20">🌟</text>
    <text x="50" y="32" font-family="Fredoka" font-weight="700" font-size="14" fill="#1e3a5f">3 de 8 actividades · ¡Vas genial, Liam!</text>
    <rect x="430" y="18" width="240" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="430" y="18" width="90" height="12" rx="6" fill="#22c55e"/>
  </g>
</svg>
