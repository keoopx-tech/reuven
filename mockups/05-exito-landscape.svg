<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.16"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="url(#gBg)"/>

  <!-- ===== CONFETTI ===== -->
  <g id="confetti" opacity="0.9">
    <circle cx="80" cy="100" r="6" fill="#ec4899"/>
    <rect x="160" y="60" width="10" height="10" rx="2" fill="#fbbf24" transform="rotate(15 165 65)"/>
    <circle cx="240" cy="90" r="5" fill="#3b82f6"/>
    <rect x="320" y="40" width="8" height="14" rx="2" fill="#22c55e" transform="rotate(-20 324 47)"/>
    <circle cx="420" cy="120" r="7" fill="#c8102e"/>
    <circle cx="560" cy="60" r="5" fill="#f97316"/>
    <rect x="660" y="80" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(40 665 85)"/>
    <circle cx="760" cy="130" r="6" fill="#fbbf24"/>
    <circle cx="860" cy="80" r="7" fill="#3b82f6"/>
    <rect x="940" y="110" width="9" height="9" rx="2" fill="#22c55e" transform="rotate(-30 944 115)"/>

    <circle cx="60" cy="280" r="6" fill="#fbbf24"/>
    <rect x="940" y="320" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(20 945 325)"/>
    <circle cx="120" cy="500" r="5" fill="#3b82f6"/>
    <rect x="900" y="540" width="8" height="14" rx="2" fill="#22c55e" transform="rotate(-15 904 547)"/>
    <circle cx="80" cy="680" r="7" fill="#ec4899"/>
    <circle cx="960" cy="690" r="6" fill="#fbbf24"/>
    <rect x="40" y="420" width="9" height="9" rx="2" fill="#c8102e" transform="rotate(35 44 425)"/>
    <circle cx="980" cy="440" r="5" fill="#f97316"/>
  </g>

  <!-- ===== CENTER CONTENT ===== -->
  <g id="center">
    <!-- Big emoji -->
    <text x="512" y="178" text-anchor="middle" font-size="120">🎉</text>

    <!-- Heading -->
    <text x="512" y="252" text-anchor="middle" class="h1" font-size="50">¡Genial, Liam!</text>
    <text x="512" y="290" text-anchor="middle" class="body" font-size="18">Has completado Vocales con 5 de 5 aciertos</text>

    <!-- 3 stars -->
    <g id="stars" transform="translate(388, 308)" filter="url(#softShadow)">
      <text x="0" y="60" font-size="68">⭐</text>
      <text x="84" y="76" font-size="80">⭐</text>
      <text x="190" y="60" font-size="68">⭐</text>
    </g>

    <!-- Stats card -->
    <g id="stats" transform="translate(232, 444)" filter="url(#softShadow)">
      <rect width="560" height="116" rx="22" fill="#fff" stroke="#e5e7eb"/>
      <!-- col 1: tiempo -->
      <text x="106" y="44" text-anchor="middle" font-size="28">⏱</text>
      <text x="106" y="78" text-anchor="middle" class="h2" font-size="22">2:30</text>
      <text x="106" y="98" text-anchor="middle" class="body" font-size="12">Tiempo</text>
      <!-- divider -->
      <line x1="186" y1="28" x2="186" y2="88" stroke="#e5e7eb"/>
      <!-- col 2: aciertos -->
      <text x="280" y="44" text-anchor="middle" font-size="28">✅</text>
      <text x="280" y="78" text-anchor="middle" class="h2" font-size="22">5/5</text>
      <text x="280" y="98" text-anchor="middle" class="body" font-size="12">Aciertos</text>
      <!-- divider -->
      <line x1="374" y1="28" x2="374" y2="88" stroke="#e5e7eb"/>
      <!-- col 3: nuevo logro -->
      <text x="468" y="44" text-anchor="middle" font-size="28">🏆</text>
      <text x="468" y="78" text-anchor="middle" class="h2" font-size="14">¡Nuevo logro!</text>
      <text x="468" y="98" text-anchor="middle" class="body" font-size="11">Maestro de vocales</text>
    </g>

    <!-- CTAs -->
    <g id="ctas" transform="translate(0, 600)">
      <g filter="url(#softShadow)">
        <rect x="320" y="0" width="220" height="56" rx="16" fill="#c8102e"/>
        <text x="430" y="34" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="16" fill="#fff">Siguiente actividad →</text>
      </g>
      <rect x="556" y="0" width="180" height="56" rx="16" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <text x="646" y="34" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#1e3a5f">Volver al hub</text>
    </g>
  </g>
</svg>
