<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="gHeroArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="gCtaStrip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#9f1d35"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.12"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; letter-spacing: -0.5px; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .label { font-family: 'Fredoka', sans-serif; font-weight: 600; fill: #1f2937; }
      .eyebrow { font-family: 'Fredoka', sans-serif; font-weight: 700; fill: #9f1d35; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="768" height="1024" fill="#f5f3ee"/>

  <!-- ===== NAV ===== -->
  <g id="nav">
    <rect x="0" y="0" width="768" height="62" fill="#f5f3ee" opacity="0.95"/>
    <line x1="0" y1="62" x2="768" y2="62" stroke="#e5e7eb"/>
    <rect x="32" y="14" width="34" height="34" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="14" width="17" height="34" rx="8" fill="#c8102e"/>
    <rect x="40" y="14" width="9" height="34" fill="#c8102e"/>
    <text x="40" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">R</text>
    <text x="58" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">F</text>
    <text x="76" y="32" class="h2" font-size="16">Reuven</text>
    <text x="76" y="46" font-family="Fredoka" font-weight="600" font-size="9" fill="#9f1d35" letter-spacing="0.5">ENSEÑAMOS A PENSAR</text>
    <!-- Hamburger -->
    <g transform="translate(700, 22)">
      <rect width="22" height="2" rx="1" fill="#1e3a5f"/>
      <rect y="7" width="22" height="2" rx="1" fill="#1e3a5f"/>
      <rect y="14" width="22" height="2" rx="1" fill="#1e3a5f"/>
    </g>
    <rect x="592" y="18" width="78" height="28" rx="14" fill="#c8102e"/>
    <text x="631" y="36" text-anchor="middle" class="label" font-size="13" fill="#fff" font-weight="700">Empezar</text>
  </g>

  <!-- ===== HERO ===== -->
  <g id="hero">
    <text x="40" y="118" class="eyebrow" font-size="11">APRENDIZAJE • LECTURA • JUEGO</text>
    <text x="40" y="170" class="h1" font-size="44">Aprender a</text>
    <text x="40" y="218" class="h1" font-size="44">leer también</text>
    <text x="40" y="266" class="h1" font-size="44">puede ser un</text>
    <text x="40" y="314" class="h1" font-size="44">juego.</text>
    <text x="40" y="354" class="body" font-size="16">Una app pensada para niños de 4 a 8 años,</text>
    <text x="40" y="376" class="body" font-size="16">con 8 actividades multisensoriales que</text>
    <text x="40" y="398" class="body" font-size="16">combinan audio, dibujo e interacción.</text>

    <rect x="40" y="424" width="170" height="50" rx="14" fill="#c8102e" filter="url(#softShadow)"/>
    <text x="125" y="455" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#fff">Empezar gratis</text>
    <rect x="226" y="424" width="170" height="50" rx="14" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <text x="311" y="455" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#1e3a5f">Ver actividades</text>

    <!-- Hero art (inline below copy) -->
    <g transform="translate(40, 510)">
      <rect width="688" height="220" rx="32" fill="url(#gHeroArt)"/>
      <g filter="url(#softShadow)">
        <rect x="40" y="30" width="120" height="120" rx="22" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/avion.png" x="52" y="42" width="96" height="96"/>
      </g>
      <g filter="url(#softShadow)" transform="rotate(6 250 80)">
        <rect x="200" y="40" width="100" height="100" rx="20" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/gato.png" x="210" y="50" width="80" height="80"/>
      </g>
      <g filter="url(#softShadow)" transform="rotate(-5 420 100)">
        <rect x="360" y="50" width="120" height="120" rx="22" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/oveja.png" x="370" y="60" width="100" height="100"/>
      </g>
      <g filter="url(#softShadow)">
        <rect x="540" y="50" width="110" height="110" rx="20" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/sol.png" x="552" y="62" width="86" height="86"/>
      </g>
    </g>
  </g>

  <!-- ===== HOW IT WORKS ===== -->
  <g id="how" transform="translate(0, 762)">
    <rect width="768" height="120" fill="#fff"/>
    <line y1="0" x2="768" y2="0" stroke="#e5e7eb"/>
    <text x="384" y="28" text-anchor="middle" class="eyebrow" font-size="11">CÓMO FUNCIONA</text>

    <g transform="translate(40, 50)">
      <rect width="220" height="56" rx="16" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="28" cy="28" r="18" fill="#1e3a5f"/>
      <text x="28" y="34" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="14" fill="#fff">1</text>
      <text x="58" y="24" class="h2" font-size="13">Crea perfil familiar</text>
      <text x="58" y="42" class="body" font-size="11">Email del adulto y niño/a.</text>
    </g>
    <g transform="translate(274, 50)">
      <rect width="220" height="56" rx="16" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="28" cy="28" r="18" fill="#1e3a5f"/>
      <text x="28" y="34" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="14" fill="#fff">2</text>
      <text x="58" y="24" class="h2" font-size="13">Elige el avatar</text>
      <text x="58" y="42" class="body" font-size="11">El peque entra con su perfil.</text>
    </g>
    <g transform="translate(508, 50)">
      <rect width="220" height="56" rx="16" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="28" cy="28" r="18" fill="#1e3a5f"/>
      <text x="28" y="34" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="14" fill="#fff">3</text>
      <text x="58" y="24" class="h2" font-size="13">A jugar y leer</text>
      <text x="58" y="42" class="body" font-size="11">10-15 min al día.</text>
    </g>
  </g>

  <!-- ===== CTA STRIP ===== -->
  <g id="cta-strip" transform="translate(40, 902)">
    <rect width="688" height="100" rx="22" fill="url(#gCtaStrip)" filter="url(#softShadow)"/>
    <text x="40" y="42" font-family="Nunito" font-weight="900" font-size="20" fill="#fff">¿Listos para empezar?</text>
    <text x="40" y="70" class="body" font-size="13" fill="#dbeafe">Tarda menos de un minuto. Solo email + nombre del peque.</text>
    <rect x="494" y="30" width="160" height="44" rx="12" fill="#fff"/>
    <text x="574" y="58" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="14" fill="#1e3a5f">Crear cuenta</text>
  </g>
</svg>
