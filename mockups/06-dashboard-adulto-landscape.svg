<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/><stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="4" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.10"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -0.5px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .h3 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .label { font-family: 'Fredoka', sans-serif; font-weight: 600; fill: #1f2937; }
      .kpi-num { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; }
      .kpi-label { font-family: 'Fredoka', sans-serif; font-weight: 600; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="#f5f3ee"/>

  <!-- ===== TOP NAV ===== -->
  <g id="topnav">
    <rect width="1024" height="60" fill="#fff"/>
    <line y1="60" x2="1024" y2="60" stroke="#e5e7eb"/>
    <rect x="32" y="14" width="32" height="32" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="14" width="16" height="32" rx="8" fill="#c8102e"/>
    <rect x="40" y="14" width="8" height="32" fill="#c8102e"/>
    <text x="40" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">R</text>
    <text x="56" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">F</text>
    <text x="74" y="32" font-family="Nunito" font-weight="800" font-size="15" fill="#1e3a5f">Reuven · Familia</text>
    <text x="74" y="46" font-family="Fredoka" font-weight="600" font-size="9" fill="#9f1d35" letter-spacing="0.5">ENSEÑAMOS A PENSAR</text>
    <text x="780" y="36" font-family="Fredoka" font-weight="500" font-size="13" fill="#6b7280">marta@email.com</text>
    <circle cx="916" cy="30" r="16" fill="#fce7f3"/>
    <text x="916" y="36" text-anchor="middle" font-size="16">👩</text>
    <text x="950" y="36" font-family="Fredoka" font-weight="700" font-size="13" fill="#9f1d35">Salir</text>
  </g>

  <!-- ===== HEADER ===== -->
  <g id="header" transform="translate(32, 80)">
    <text x="0" y="22" class="h1" font-size="26">Hola, Marta</text>
    <text x="0" y="48" class="body" font-size="14">Progreso de</text>
    <!-- Child selector dropdown -->
    <rect x="80" y="32" width="180" height="28" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <text x="92" y="51" font-size="14">🦊</text>
    <text x="116" y="51" font-family="Fredoka" font-weight="700" font-size="13" fill="#1e3a5f">Liam</text>
    <text x="248" y="50" font-family="Nunito" font-weight="900" font-size="11" fill="#6b7280">▼</text>
    <!-- Date range -->
    <rect x="800" y="20" width="190" height="36" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <text x="816" y="42" font-size="13">📅</text>
    <text x="836" y="42" font-family="Fredoka" font-weight="600" font-size="13" fill="#1e3a5f">Esta semana</text>
    <text x="970" y="42" font-family="Nunito" font-weight="900" font-size="11" fill="#6b7280">▼</text>
  </g>

  <!-- ===== KPI ROW ===== -->
  <g id="kpis" transform="translate(32, 152)">
    <g filter="url(#softShadow)">
      <rect width="232" height="92" rx="18" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="22">📅</text>
      <text x="50" y="36" class="kpi-label" font-size="12">Días activos</text>
      <text x="20" y="74" class="kpi-num" font-size="28">5/7</text>
    </g>
    <g transform="translate(248, 0)" filter="url(#softShadow)">
      <rect width="232" height="92" rx="18" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="22">⏱</text>
      <text x="50" y="36" class="kpi-label" font-size="12">Tiempo total</text>
      <text x="20" y="74" class="kpi-num" font-size="28">1h 12min</text>
    </g>
    <g transform="translate(496, 0)" filter="url(#softShadow)">
      <rect width="232" height="92" rx="18" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="22">✅</text>
      <text x="50" y="36" class="kpi-label" font-size="12">Actividades completadas</text>
      <text x="20" y="74" class="kpi-num" font-size="28">5/8</text>
    </g>
    <g transform="translate(744, 0)" filter="url(#softShadow)">
      <rect width="232" height="92" rx="18" fill="#fff" stroke="#e5e7eb"/>
      <text x="20" y="34" font-size="22">🏆</text>
      <text x="50" y="36" class="kpi-label" font-size="12">Logros desbloqueados</text>
      <text x="20" y="74" class="kpi-num" font-size="28">3</text>
    </g>
  </g>

  <!-- ===== MAIN AREA: chart + activities | sidebar ===== -->
  <!-- Left column -->
  <g id="chart" transform="translate(32, 264)">
    <rect width="588" height="220" rx="18" fill="#fff" stroke="#e5e7eb" filter="url(#softShadow)"/>
    <text x="20" y="32" class="h3" font-size="16">Tiempo por día (minutos)</text>
    <text x="20" y="52" class="body" font-size="11">Última semana</text>

    <!-- Y axis -->
    <text x="46" y="84" text-anchor="end" class="body" font-size="10">30</text>
    <text x="46" y="124" text-anchor="end" class="body" font-size="10">20</text>
    <text x="46" y="164" text-anchor="end" class="body" font-size="10">10</text>
    <text x="46" y="194" text-anchor="end" class="body" font-size="10">0</text>
    <line x1="50" y1="80" x2="568" y2="80" stroke="#f3f4f6"/>
    <line x1="50" y1="120" x2="568" y2="120" stroke="#f3f4f6"/>
    <line x1="50" y1="160" x2="568" y2="160" stroke="#f3f4f6"/>
    <line x1="50" y1="190" x2="568" y2="190" stroke="#e5e7eb"/>

    <!-- Bars: L M X J V S D (15, 22, 0, 18, 25, 12, 8 min) -->
    <rect x="76" y="130" width="48" height="60" rx="6" fill="#c8102e"/>
    <text x="100" y="208" text-anchor="middle" class="label" font-size="11">L</text>
    <text x="100" y="124" text-anchor="middle" class="kpi-num" font-size="11">15</text>

    <rect x="148" y="102" width="48" height="88" rx="6" fill="#c8102e"/>
    <text x="172" y="208" text-anchor="middle" class="label" font-size="11">M</text>
    <text x="172" y="96" text-anchor="middle" class="kpi-num" font-size="11">22</text>

    <rect x="220" y="186" width="48" height="4" rx="2" fill="#e5e7eb"/>
    <text x="244" y="208" text-anchor="middle" class="label" font-size="11">X</text>
    <text x="244" y="178" text-anchor="middle" class="body" font-size="10">—</text>

    <rect x="292" y="118" width="48" height="72" rx="6" fill="#c8102e"/>
    <text x="316" y="208" text-anchor="middle" class="label" font-size="11">J</text>
    <text x="316" y="112" text-anchor="middle" class="kpi-num" font-size="11">18</text>

    <rect x="364" y="90" width="48" height="100" rx="6" fill="#1e3a5f"/>
    <text x="388" y="208" text-anchor="middle" class="label" font-size="11" fill="#1e3a5f" font-weight="800">V</text>
    <text x="388" y="84" text-anchor="middle" class="kpi-num" font-size="11">25</text>

    <rect x="436" y="142" width="48" height="48" rx="6" fill="#c8102e"/>
    <text x="460" y="208" text-anchor="middle" class="label" font-size="11">S</text>
    <text x="460" y="136" text-anchor="middle" class="kpi-num" font-size="11">12</text>

    <rect x="508" y="158" width="48" height="32" rx="6" fill="#c8102e"/>
    <text x="532" y="208" text-anchor="middle" class="label" font-size="11">D</text>
    <text x="532" y="152" text-anchor="middle" class="kpi-num" font-size="11">8</text>
  </g>

  <!-- Activities list -->
  <g id="activities-list" transform="translate(32, 500)">
    <rect width="588" height="240" rx="18" fill="#fff" stroke="#e5e7eb" filter="url(#softShadow)"/>
    <text x="20" y="32" class="h3" font-size="16">Progreso por actividad</text>

    <!-- Row helper: emoji name % bar -->
    <g transform="translate(20, 56)">
      <text x="0" y="16" font-size="16">🎨</text>
      <text x="28" y="16" class="label" font-size="13">Vocales</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#22c55e"/>
      <text x="540" y="16" text-anchor="end" class="kpi-num" font-size="13">100%</text>
    </g>
    <g transform="translate(20, 80)">
      <text x="0" y="16" font-size="16">✏️</text>
      <text x="28" y="16" class="label" font-size="13">Escribir</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#22c55e"/>
      <text x="540" y="16" text-anchor="end" class="kpi-num" font-size="13">100%</text>
    </g>
    <g transform="translate(20, 104)">
      <text x="0" y="16" font-size="16">🔤</text>
      <text x="28" y="16" class="label" font-size="13">Huecos</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#22c55e"/>
      <text x="540" y="16" text-anchor="end" class="kpi-num" font-size="13">100%</text>
    </g>
    <g transform="translate(20, 128)">
      <text x="0" y="16" font-size="16">🔀</text>
      <text x="28" y="16" class="label" font-size="13">Ordenar</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <rect x="220" y="6" width="168" height="10" rx="5" fill="#c8102e"/>
      <text x="540" y="16" text-anchor="end" class="kpi-num" font-size="13" fill="#9f1d35">60%</text>
    </g>
    <g transform="translate(20, 152)">
      <text x="0" y="16" font-size="16">🔢</text>
      <text x="28" y="16" class="label" font-size="13">Sílabas</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <rect x="220" y="6" width="56" height="10" rx="5" fill="#c8102e"/>
      <text x="540" y="16" text-anchor="end" class="kpi-num" font-size="13" fill="#9f1d35">20%</text>
    </g>
    <g transform="translate(20, 176)">
      <text x="0" y="16" font-size="16" opacity="0.4">👂</text>
      <text x="28" y="16" class="label" font-size="13" fill="#9ca3af">Sonido R</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <text x="540" y="16" text-anchor="end" class="body" font-size="12">Bloqueada</text>
    </g>
    <g transform="translate(20, 200)">
      <text x="0" y="16" font-size="16" opacity="0.4">🧩</text>
      <text x="28" y="16" class="label" font-size="13" fill="#9ca3af">Unir</text>
      <rect x="220" y="6" width="280" height="10" rx="5" fill="#e5e7eb"/>
      <text x="540" y="16" text-anchor="end" class="body" font-size="12">Bloqueada</text>
    </g>
  </g>

  <!-- Sidebar (right) -->
  <g id="sidebar" transform="translate(636, 264)">
    <rect width="356" height="476" rx="18" fill="#fff" stroke="#e5e7eb" filter="url(#softShadow)"/>
    <text x="20" y="32" class="h3" font-size="16">Recomendaciones</text>
    <line x1="20" y1="46" x2="336" y2="46" stroke="#e5e7eb"/>

    <g transform="translate(20, 64)">
      <text x="0" y="18" font-size="20">⏱</text>
      <text x="32" y="18" class="h2" font-size="13">Sesiones cortas y frecuentes</text>
      <text x="32" y="38" class="body" font-size="11">10-15 min al día rinden más</text>
      <text x="32" y="54" class="body" font-size="11">que una hora a la semana.</text>
    </g>

    <g transform="translate(20, 142)">
      <text x="0" y="18" font-size="20">💚</text>
      <text x="32" y="18" class="h2" font-size="13">Celebra el intento</text>
      <text x="32" y="38" class="body" font-size="11">No solo el acierto. Equivocarse</text>
      <text x="32" y="54" class="body" font-size="11">forma parte del proceso.</text>
    </g>

    <g transform="translate(20, 220)">
      <text x="0" y="18" font-size="20">📖</text>
      <text x="32" y="18" class="h2" font-size="13">Lee en voz alta con él/ella</text>
      <text x="32" y="38" class="body" font-size="11">Antes o después de la sesión.</text>
      <text x="32" y="54" class="body" font-size="11">Refuerza lo aprendido.</text>
    </g>

    <!-- RGPD badge -->
    <g transform="translate(20, 320)">
      <rect width="316" height="80" rx="14" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="34" font-size="24">🔒</text>
      <text x="50" y="32" class="h2" font-size="13">RGPD · Datos seguros</text>
      <text x="50" y="52" class="body" font-size="11">Solo tú ves el progreso de Liam.</text>
      <text x="50" y="68" class="body" font-size="11">Descarga o borra los datos cuando quieras.</text>
    </g>

    <!-- Vincular profesional -->
    <g transform="translate(20, 416)">
      <rect width="316" height="44" rx="12" fill="#1e3a5f"/>
      <text x="158" y="28" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="13" fill="#fff">+ Vincular profesional</text>
    </g>
  </g>
</svg>
