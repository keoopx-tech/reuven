<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" font-family="Fredoka, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gTealNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="gHeroArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="6" in="blur" result="offset"/>
      <feFlood flood-color="#1e3a5f" flood-opacity="0.12"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .h1 { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #1e3a5f; letter-spacing: -1px; }
      .h2 { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #1e3a5f; letter-spacing: -0.5px; }
      .body { font-family: 'Fredoka', sans-serif; fill: #6b7280; }
      .label { font-family: 'Fredoka', sans-serif; font-weight: 600; fill: #1f2937; }
      .eyebrow { font-family: 'Fredoka', sans-serif; font-weight: 700; fill: #9f1d35; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1024" height="768" fill="#f5f3ee"/>

  <!-- ===== NAV ===== -->
  <g id="nav">
    <rect x="0" y="0" width="1024" height="62" fill="#f5f3ee" opacity="0.95"/>
    <line x1="0" y1="62" x2="1024" y2="62" stroke="#e5e7eb"/>
    <!-- Brand -->
    <rect x="32" y="14" width="34" height="34" rx="8" fill="#1e3a5f"/>
    <rect x="32" y="14" width="17" height="34" rx="8" fill="#c8102e"/>
    <rect x="40" y="14" width="9" height="34" fill="#c8102e"/>
    <text x="40" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">R</text>
    <text x="58" y="37" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#fff">F</text>
    <text x="76" y="32" class="h2" font-size="16">Reuven</text>
    <text x="76" y="46" font-family="Fredoka" font-weight="600" font-size="9" fill="#9f1d35" letter-spacing="0.5">ENSEÑAMOS A PENSAR</text>
    <!-- Links -->
    <text x="640" y="38" class="label" font-size="14" fill="#6b7280">Cómo funciona</text>
    <text x="752" y="38" class="label" font-size="14" fill="#6b7280">Para quién</text>
    <text x="844" y="38" class="label" font-size="14" fill="#6b7280">Actividades</text>
    <!-- CTA -->
    <rect x="932" y="18" width="72" height="28" rx="14" fill="#c8102e"/>
    <text x="968" y="36" text-anchor="middle" class="label" font-size="13" fill="#fff" font-weight="700">Empezar</text>
  </g>

  <!-- ===== HERO ===== -->
  <g id="hero">
    <text x="48" y="148" class="eyebrow" font-size="11">APRENDIZAJE • LECTURA • JUEGO</text>
    <text x="48" y="200" class="h1" font-size="42">Aprender a leer</text>
    <text x="48" y="246" class="h1" font-size="42">también puede ser</text>
    <text x="48" y="292" class="h1" font-size="42">un juego.</text>
    <text x="48" y="334" class="body" font-size="16">Una app pensada para niños y niñas de 4 a 8 años, con</text>
    <text x="48" y="356" class="body" font-size="16">8 actividades multisensoriales que combinan audio, dibujo</text>
    <text x="48" y="378" class="body" font-size="16">e interacción. Acompañada por familia y profesionales.</text>
    <!-- CTAs -->
    <rect x="48" y="408" width="152" height="48" rx="14" fill="#c8102e" filter="url(#softShadow)"/>
    <text x="124" y="438" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#fff">Empezar gratis</text>
    <rect x="216" y="408" width="148" height="48" rx="14" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <text x="290" y="438" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="15" fill="#1e3a5f">Ver actividades</text>

    <!-- Hero art (right side) -->
    <g id="hero-art" transform="translate(560, 120)">
      <rect x="0" y="0" width="420" height="320" rx="40" fill="url(#gHeroArt)"/>
      <!-- Floating cards -->
      <g filter="url(#softShadow)">
        <rect x="30" y="30" width="110" height="110" rx="20" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/avion.png" x="42" y="42" width="86" height="86"/>
      </g>
      <g filter="url(#softShadow)" transform="rotate(6 320 80)">
        <rect x="270" y="40" width="100" height="100" rx="20" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/gato.png" x="280" y="50" width="80" height="80"/>
      </g>
      <g filter="url(#softShadow)" transform="rotate(-5 110 240)">
        <rect x="50" y="180" width="120" height="120" rx="22" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/oveja.png" x="60" y="190" width="100" height="100"/>
      </g>
      <g filter="url(#softShadow)">
        <rect x="280" y="190" width="100" height="100" rx="20" fill="#fff" stroke="#e5e7eb"/>
        <image href="../assets/sol.png" x="290" y="200" width="80" height="80"/>
      </g>
    </g>
  </g>

  <!-- ===== HOW IT WORKS (3 cards) ===== -->
  <g id="how" transform="translate(0, 480)">
    <rect x="0" y="0" width="1024" height="160" fill="#ffffff"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#e5e7eb"/>
    <text x="512" y="34" text-anchor="middle" class="eyebrow" font-size="11">CÓMO FUNCIONA</text>
    <text x="512" y="60" text-anchor="middle" class="h2" font-size="22">3 pasos para empezar</text>

    <g transform="translate(48, 86)">
      <rect width="296" height="60" rx="18" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="32" cy="30" r="20" fill="#1e3a5f"/>
      <text x="32" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#fff">1</text>
      <text x="64" y="26" class="h2" font-size="14">Crea perfil familiar</text>
      <text x="64" y="46" class="body" font-size="12">Email del adulto y nombre del peque.</text>
    </g>
    <g transform="translate(364, 86)">
      <rect width="296" height="60" rx="18" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="32" cy="30" r="20" fill="#1e3a5f"/>
      <text x="32" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#fff">2</text>
      <text x="64" y="26" class="h2" font-size="14">Elige el avatar</text>
      <text x="64" y="46" class="body" font-size="12">El niño o niña entra con su perfil.</text>
    </g>
    <g transform="translate(680, 86)">
      <rect width="296" height="60" rx="18" fill="#f5f3ee" stroke="#e5e7eb"/>
      <circle cx="32" cy="30" r="20" fill="#1e3a5f"/>
      <text x="32" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#fff">3</text>
      <text x="64" y="26" class="h2" font-size="14">A jugar y leer</text>
      <text x="64" y="46" class="body" font-size="12">8 actividades, 10-15 min al día.</text>
    </g>
  </g>

  <!-- ===== ACTIVITIES (4x2 grid) ===== -->
  <g id="activities" transform="translate(0, 640)">
    <rect x="0" y="0" width="1024" height="128" fill="#f5f3ee"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#e5e7eb"/>
    <text x="512" y="20" text-anchor="middle" class="eyebrow" font-size="10">8 ACTIVIDADES</text>

    <!-- 8 cards in one row, scaled small -->
    <g transform="translate(28, 30)">
      <!-- 01 Vocales -->
      <g><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🎨</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">01</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Vocales</text>
      </g>
      <g transform="translate(124,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">✏️</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">02</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Escribir</text>
      </g>
      <g transform="translate(248,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🔤</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">03</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Huecos</text>
      </g>
      <g transform="translate(372,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🔀</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">04</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Ordenar</text>
      </g>
      <g transform="translate(496,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🔢</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">05</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Sílabas</text>
      </g>
      <g transform="translate(620,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">👂</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">06</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Sonido R</text>
      </g>
      <g transform="translate(744,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🧩</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">07</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Unir</text>
      </g>
      <g transform="translate(868,0)"><rect width="116" height="86" rx="16" fill="#fff" stroke="#e5e7eb"/>
        <text x="58" y="32" text-anchor="middle" font-size="22">🌈</text>
        <text x="58" y="56" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="9" fill="#9f1d35">08</text>
        <text x="58" y="72" text-anchor="middle" class="label" font-size="12" fill="#1e3a5f">Colorear</text>
      </g>
    </g>
  </g>
</svg>
