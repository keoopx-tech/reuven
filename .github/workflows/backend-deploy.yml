name: Backend — Test & Deploy

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: reuven_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run Alembic migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reuven_test
          JWT_SECRET: test-secret-32-characters-minimum
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reuven_test
          JWT_SECRET: test-secret-32-characters-minimum
          ENVIRONMENT: test
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing -q

  deploy:
    name: Deploy to Azure App Service
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../app.zip . -x "*.pyc" -x "__pycache__/*" -x ".venv/*" -x "tests/*"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: reuven-api
          package: app.zip

      - name: Run Alembic upgrade in production
        run: |
          az webapp ssh \
            --name reuven-api \
            --resource-group reuven-rg \
            --command "cd /home/site/wwwroot && alembic upgrade head"
